<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrôle Servo ESP32</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌐 Contrôle Portail a distance</h1>
    <p class="subtitle">Gérez votre barrière en temps réel depuis votre navigateur</p>
  </header>

  <main>
    <div class="container">
      <div class="servo-animation">
        <div id="servoArm"></div>
      </div>
      <button id="open" class="btn btn-open">Ouvrir</button>
      <button id="close" class="btn btn-close">Fermer</button>
      <p id="status">Statut : Inconnu</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 MIOKY RAKOTOARIVELO. Tous droits réservés.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
